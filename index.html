<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Diorama 3D do bonde Enoden 305 passando por uma rua japonesa, feito com Three.js.">
<title>Enoden 305 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: tela cheia 3D; etiqueta no canto superior; barra de controles flutuante embaixo */
:root{
  --ink:#f1ecd8; --mute:#b8b39f; --panel:rgba(20,26,22,.74); --line:rgba(241,236,216,.16);
  --green:#5b9a5e; --cream:#e9dfb6; --bg:#121714;
  --display:"Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--display)}
#c{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}
.tag{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));
  background:var(--panel);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:10px;padding:10px 14px;max-width:calc(100% - 32px)}
.tag h1{margin:0;font-size:18px;font-weight:900;letter-spacing:.02em}
.tag h1 span{color:var(--cream);font-weight:700}
.tag p{margin:3px 0 0;font:12px/1.4 var(--mono);color:var(--mute)}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));
  display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;background:var(--panel);backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:12px;padding:6px;width:max-content;max-width:calc(100% - 32px)}
.bar button{font:500 13px var(--mono);color:var(--ink);background:transparent;border:1px solid transparent;border-radius:8px;padding:8px 11px;cursor:pointer}
.bar button:hover{border-color:var(--line)}
.bar button:focus-visible,.bar input:focus-visible{outline:2px solid var(--cream);outline-offset:1px}
.bar button[aria-pressed="true"]{background:var(--green);color:#0d140e}
.bar .play{background:var(--cream);color:#1a1a10;min-width:92px}
.sep{width:1px;align-self:stretch;background:var(--line);margin:4px 2px}
.spd{display:flex;align-items:center;gap:8px;font:12px var(--mono);color:var(--mute);padding:0 6px}
.spd input{width:110px;accent-color:var(--green)}
.spd output{color:var(--ink);min-width:62px;font-variant-numeric:tabular-nums}
.tod{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px));display:flex;gap:4px;background:var(--panel);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:10px;padding:5px}
.tod button{font:500 13px var(--mono);color:var(--ink);background:transparent;border:1px solid transparent;border-radius:7px;padding:7px 11px;cursor:pointer}
.tod button:hover{border-color:var(--line)}
.tod button:focus-visible{outline:2px solid var(--cream);outline-offset:1px}
.tod button[aria-pressed="true"]{background:var(--cream);color:#1a1a10}
.hint{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(66px + env(safe-area-inset-top,0px));font:11px/1.5 var(--mono);color:var(--mute);text-align:right}
@media (max-width:640px){.hint{display:none}.tod{top:auto;bottom:calc(150px + env(safe-area-inset-bottom,0px))}.tag h1{font-size:16px}.spd input{width:80px}}
.arLink{position:fixed;top:calc(96px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));font:900 14px var(--display);color:#13200f;background:var(--cream);border-radius:999px;padding:9px 16px;text-decoration:none;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.arLink:focus-visible{outline:2px solid var(--green);outline-offset:2px}
</style>
</head>
<body>
<canvas id="c" aria-label="Modelo 3D do bonde Enoden 305 passando pelos trilhos"></canvas>
<div class="tag">
  <h1>江ノ電 305 <span>Enoden</span></h1>
  <p>bonde na rua · barbearia · loja · ponto · bicicletas · konbini na esquina</p>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ================= medidas (metros) =================
const L = 13.0, W = 2.5, C = 0.5;          // comprimento, largura, chanfro da cabine
const Y0 = 0.95, Y1 = 1.9, Y2 = 2.9;       // piso, linha da cintura, topo das paredes
const RISE = 0.48;                         // altura do arco do teto
const LP = L - 2 * C;                      // trecho reto das laterais
const GAUGE = 1.067, RAIL_Z = GAUGE / 2 + 0.0325, WHEEL_R = 0.36, AXLE_Y = 0.15 + WHEEL_R;
const TRACK_LEN = 44.5, START = -22.5, END = 37;    // trecho = largura do cubo (-15 a 29,5)

const GREEN = '#4f8a54', GREEN_DK = '#3f7346', CREAM = '#e6dbb0', ROOF_GREEN = '#4b8150';

// ================= renderer / cena =================
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const ANISO = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 600);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.minDistance = 1.5; controls.maxDistance = 130;
controls.maxPolarAngle = Math.PI * 0.497;

// céu de fim de tarde (fundo + mapa de reflexo dos vidros e metais)
const SKY_TOP = new THREE.Color('#5d93cf'), SKY_HOR = new THREE.Color('#f3e3c3'), GROUND_C = new THREE.Color('#6d675c');
function skyMesh(r) {
  return new THREE.Mesh(new THREE.SphereGeometry(r, 48, 24), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    uniforms: { top: { value: SKY_TOP }, hor: { value: SKY_HOR }, gnd: { value: GROUND_C }, sun: { value: new THREE.Vector3(-0.45, 0.5, 0.74).normalize() } },
    vertexShader: 'varying vec3 d; void main(){ d = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
    fragmentShader: `uniform vec3 top, hor, gnd, sun; varying vec3 d;
      void main(){ float h = d.y;
        vec3 c = h > 0. ? mix(hor, top, pow(smoothstep(0., .55, h), .8)) : mix(hor*.85, gnd, smoothstep(0., -.08, h));
        float s = max(dot(d, sun), 0.); c += vec3(1., .85, .6) * (pow(s, 600.)*6. + pow(s, 12.)*.25);
        gl_FragColor = vec4(c, 1.); }`
  }));
}
scene.background = new THREE.Color('#ffffff');
const envScene = new THREE.Scene(); envScene.add(skyMesh(50));
// painéis de luz no ambiente refletido: criam faixas de brilho na lataria
const envPanels = [];
for (const [az, y, w, h, k] of [[0.35, 4, 26, 5, 3.2], [2.6, 3, 18, 4, 2.4], [-1.2, 6, 30, 3, 2.8], [4.2, 2.5, 14, 6, 2.0], [1.5, 14, 30, 8, 1.6]]) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(1, 0.97, 0.92).multiplyScalar(k), side: THREE.DoubleSide }));
  envPanels.push({ m, k });
  m.position.set(Math.sin(az) * 40, y, Math.cos(az) * 40); m.lookAt(0, y * 0.3, 0); envScene.add(m);
}
const envFloor = new THREE.Mesh(new THREE.CircleGeometry(49, 32), new THREE.MeshBasicMaterial({ color: '#3a3833' }));
envFloor.rotation.x = -Math.PI / 2; envFloor.position.y = -1.5; envScene.add(envFloor);
const pmrem = new THREE.PMREMGenerator(renderer);
let envRT = pmrem.fromScene(envScene, 0.0); scene.environment = envRT.texture;

// ================= utilitários de textura =================
function rnd(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
const R = rnd(305);
function canvasTex(w, h, draw, { repeat, srgb = true } = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = ANISO;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); }
  return t;
}
function speckle(g, w, h, n, alpha, dark = '20,20,18', light = '255,252,240', size = 2) {
  for (let i = 0; i < n; i++) {
    g.fillStyle = `rgba(${R() > .5 ? dark : light},${R() * alpha})`;
    const s = size * (0.5 + R()); g.fillRect(R() * w, R() * h, s, s);
  }
}
function streaks(g, w, h, n, alpha, fromTop = true) {
  for (let i = 0; i < n; i++) {
    const x = R() * w, len = h * (0.2 + R() * 0.8), y0 = fromTop ? 0 : h - len;
    const gr = g.createLinearGradient(0, y0, 0, y0 + len);
    gr.addColorStop(fromTop ? 0 : 1, `rgba(45,40,30,${alpha * (0.4 + R())})`);
    gr.addColorStop(fromTop ? 1 : 0, 'rgba(45,40,30,0)');
    g.fillStyle = gr; g.fillRect(x, y0, 1 + R() * 3, len);
  }
}
// sujeira genérica (multiplica a cor do material)
const grimeTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#f2f2f2'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 40; i++) {
    const x = R() * w, y = R() * h, r = 20 + R() * 90, gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, `rgba(120,115,100,${0.08 + R() * 0.12})`); gr.addColorStop(1, 'rgba(120,115,100,0)');
    g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r);
  }
  speckle(g, w, h, 9000, .12);
}, { repeat: [0.35, 0.35] });

// ================= layout da carroceria (frente do trem em +x) =================
const WINDOWS = [-4.95, -3.95, -2.95, -1.95, 0.45, 1.45, 2.45].map(x => ({ x, w: 0.8 }));
const CAB_WIN = [{ x: 5.25, w: 0.6 }, { x: -5.75, w: 0.4 }];
const DOORS = [{ x: -0.75, w: 0.95 }, { x: 3.65, w: 0.95 }];
const WIN_Y = [2.0, 2.74], DOOR_TOP = 2.82, DOOR_WIN_Y = [2.08, 2.66], DOOR_WIN_W = 0.5;
const WT = 0.05;                                           // espessura da chapa + estrutura
const PAINT = { metalness: 0.6, roughness: 0.14, clearcoat: 1, clearcoatRoughness: 0.03, envMapIntensity: 1.8 };

// ================= materiais =================
const M = {
  green:   new THREE.MeshPhysicalMaterial({ color: GREEN, map: grimeTex, ...PAINT }),
  greenDk: new THREE.MeshPhysicalMaterial({ color: GREEN_DK, map: grimeTex, ...PAINT }),
  cream:   new THREE.MeshPhysicalMaterial({ color: CREAM, map: grimeTex, ...PAINT }),
  roof:    new THREE.MeshPhysicalMaterial({ color: ROOF_GREEN, map: grimeTex, metalness: 0.4, roughness: 0.3, clearcoat: 0.8, clearcoatRoughness: 0.12, side: THREE.DoubleSide }),
  roofMat: new THREE.MeshStandardMaterial({ color: '#4a4c4a', map: grimeTex, roughness: 0.95 }),
  gutter:  new THREE.MeshPhysicalMaterial({ color: GREEN_DK, ...PAINT }),
  trim:    new THREE.MeshStandardMaterial({ color: '#dfe1df', metalness: 1.0, roughness: 0.16 }),
  alu:     new THREE.MeshStandardMaterial({ color: '#c3c7c4', metalness: 0.9, roughness: 0.28 }),
  rubber:  new THREE.MeshStandardMaterial({ color: '#161716', roughness: 0.75 }),
  chrome:  new THREE.MeshStandardMaterial({ color: '#eceef0', metalness: 1.0, roughness: 0.08 }),
  stainless: new THREE.MeshStandardMaterial({ color: '#b9bcbd', metalness: 0.9, roughness: 0.35 }),
  under:   new THREE.MeshStandardMaterial({ color: '#232523', map: grimeTex, roughness: 0.75, metalness: 0.3 }),
  underB:  new THREE.MeshStandardMaterial({ color: '#2e302d', map: grimeTex, roughness: 0.8, metalness: 0.35 }),
  steel:   new THREE.MeshStandardMaterial({ color: '#5a5650', metalness: 0.8, roughness: 0.45 }),
  wheel:   new THREE.MeshStandardMaterial({ color: '#3a3733', metalness: 0.75, roughness: 0.5 }),
  tread:   new THREE.MeshStandardMaterial({ color: '#b9b6b0', metalness: 1.0, roughness: 0.28 }),
  white:   new THREE.MeshStandardMaterial({ color: '#e8e6df', roughness: 0.6 }),
  ventGray:new THREE.MeshStandardMaterial({ color: '#b7bab4', map: grimeTex, metalness: 0.45, roughness: 0.4 }),
  // vidro de verdade: transmissão física (refrata, reflete o ambiente, levemente esverdeado na espessura)
  glass:   new THREE.MeshPhysicalMaterial({ color: '#ffffff', metalness: 0, roughness: 0.0, transmission: 1, thickness: 0.006, ior: 1.52,
             attenuationColor: new THREE.Color('#bfe3d2'), attenuationDistance: 0.25, specularIntensity: 1, envMapIntensity: 1.6, side: THREE.DoubleSide }),
  lens:    new THREE.MeshPhysicalMaterial({ color: '#fff7e0', emissive: '#fff1c8', emissiveIntensity: 1.6, roughness: 0.05, clearcoat: 1 }),
  tail:    new THREE.MeshPhysicalMaterial({ color: '#7a1010', emissive: '#ff2a1a', emissiveIntensity: 0.4, roughness: 0.1, clearcoat: 1 }),
  lining:  new THREE.MeshStandardMaterial({ color: '#dcd5c2', roughness: 0.6 }),
  ceiling: new THREE.MeshStandardMaterial({ color: '#efe9da', roughness: 0.7, side: THREE.DoubleSide }),
  floor:   new THREE.MeshStandardMaterial({ color: '#6e5c49', map: grimeTex, roughness: 0.75 }),
  seat:    new THREE.MeshStandardMaterial({ color: '#7c2f27', roughness: 0.95 }),
  lamp:    new THREE.MeshStandardMaterial({ color: '#ffffff', emissive: '#fff4dc', emissiveIntensity: 1.4 }),
  console: new THREE.MeshStandardMaterial({ color: '#3a403c', roughness: 0.55, metalness: 0.3 }),
};
const roofTex = canvasTex(512, 256, (g, w, h) => {
  g.fillStyle = '#ececec'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 30; i++) { const x = R() * w, y = R() * h, r = 15 + R() * 60, gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, `rgba(90,85,70,${.1 + R() * .2})`); gr.addColorStop(1, 'rgba(90,85,70,0)'); g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r); }
  for (let x = 0; x < w; x += w / 5) { g.fillStyle = 'rgba(40,40,35,.5)'; g.fillRect(x, 0, 2, h); g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(x + 2, 0, 1, h); }
  for (let i = 0; i < 60; i++) { g.fillStyle = 'rgba(60,55,45,.18)'; g.fillRect(R() * w, R() * h, 30 + R() * 120, 1 + R() * 2); }
  for (let i = 0; i < 25; i++) { g.fillStyle = 'rgba(245,245,235,.7)'; g.beginPath(); g.arc(R() * w, R() * h, 1 + R() * 2.5, 0, 7); g.fill(); }
  speckle(g, w, h, 7000, .16);
}, { repeat: [1, 1] });
M.roof.map = roofTex; M.roof.bumpMap = roofTex; M.roof.bumpScale = 0.8;
const louvreTex = canvasTex(256, 64, (g, w, h) => {
  g.fillStyle = '#b7bab4'; g.fillRect(0, 0, w, h);
  for (let y = 6; y < h - 4; y += 6) { g.fillStyle = '#5d605b'; g.fillRect(6, y, w - 12, 3); g.fillStyle = '#d9dcd6'; g.fillRect(6, y + 3, w - 12, 1); }
  speckle(g, w, h, 600, .15);
});
M.louvre = new THREE.MeshStandardMaterial({ map: louvreTex, metalness: 0.35, roughness: 0.55 });

// ================= helpers de geometria =================
const box = (sx, sy, sz, mat, x = 0, y = 0, z = 0, parent) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), mat); m.position.set(x, y, z); (parent || train.body).add(m); return m;
};
const cylZ = (r, len, mat, seg = 32) => { const g = new THREE.CylinderGeometry(r, r, len, seg); g.rotateX(Math.PI / 2); return new THREE.Mesh(g, mat); };
const cylX = (r, len, mat, seg = 32) => { const g = new THREE.CylinderGeometry(r, r, len, seg); g.rotateZ(Math.PI / 2); return new THREE.Mesh(g, mat); };
const bx = (f, sx, sy, sz, mat, x, y, z) => box(sx, sy, sz, mat, x, y, z, f);

// ================= o trem =================
const train = new THREE.Group(); scene.add(train);
train.body = new THREE.Group(); train.add(train.body);

// ----- pintura (verde/creme) com sujeira e relevo, gerada por parede -----
function makePaint(widthM, o = {}) {
  const w = o.tw || 2048, h = o.th || 512, area = w * h / (2048 * 512);
  const px = x => (x / widthM + 0.5) * w, yp = y => (Y2 - y) / (Y2 - Y0) * h;
  const map = canvasTex(w, h, g => {
    g.fillStyle = CREAM; g.fillRect(0, 0, w, yp(Y1) + 1);
    g.fillStyle = GREEN; g.fillRect(0, yp(Y1), w, h);
    speckle(g, w, h, 30000 * area, .08, '30,30,20', '255,255,240');
    streaks(g, w, h, Math.max(8, 140 * area), .10, true);
    const gb = g.createLinearGradient(0, yp(Y0 + 0.5), 0, h);
    gb.addColorStop(0, 'rgba(40,35,25,0)'); gb.addColorStop(1, 'rgba(40,35,25,.42)'); g.fillStyle = gb; g.fillRect(0, yp(Y0 + 0.5), w, h);
    const gt = g.createLinearGradient(0, 0, 0, h * .06); gt.addColorStop(0, 'rgba(50,45,30,.4)'); gt.addColorStop(1, 'rgba(50,45,30,0)');
    g.fillStyle = gt; g.fillRect(0, 0, w, h * .06);
    for (const wd of o.windows || []) for (const e of [-1, 1]) {           // escorridos dos cantos das janelas
      const x = px(wd.x + e * wd.w * 0.45), y = yp(WIN_Y[0]) + 2, l = 20 + R() * 70;
      const gr = g.createLinearGradient(0, y, 0, y + l); gr.addColorStop(0, 'rgba(70,60,40,.45)'); gr.addColorStop(1, 'rgba(70,60,40,0)');
      g.fillStyle = gr; g.fillRect(x - 2, y, 3 + R() * 3, l);
    }
    for (let i = 0; i < 26 * area + 2; i++) {                               // ferrugem perto da saia
      const x = R() * w, y = h - 10 - R() * 30, r = 1.5 + R() * 4;
      g.fillStyle = `rgba(${110 + R() * 40 | 0},${60 + R() * 20 | 0},30,${.15 + R() * .25})`; g.beginPath(); g.ellipse(x, y, r * 1.6, r, 0, 0, 7); g.fill();
      g.fillStyle = 'rgba(120,70,35,.22)'; g.fillRect(x - 1, y, 2, 8 + R() * 20);
    }
    g.fillStyle = 'rgba(20,40,20,.4)'; for (const x of o.seams || []) g.fillRect(px(x) - 1, yp(Y1), 2, h);
    g.fillStyle = 'rgba(15,30,15,.35)';
    for (let x = -widthM / 2 + 0.06; x < widthM / 2; x += 0.12) { g.beginPath(); g.arc(px(x), yp(Y0 + 0.08), 2, 0, 7); g.fill(); }
    if (o.number !== undefined) {
      g.fillStyle = 'rgba(240,235,215,.92)'; g.font = '700 46px "IBM Plex Mono", monospace'; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText('305', px(o.number), yp(1.3));
    }
    if (o.emblem !== undefined) {                                            // emblema da companhia (onda estilizada)
      const cx = px(o.emblem), cy = yp(1.45), r = 26;
      g.fillStyle = 'rgba(235,228,200,.95)'; g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fill();
      g.fillStyle = GREEN_DK; g.beginPath(); g.arc(cx, cy, r - 5, 0, 7); g.fill();
      g.strokeStyle = 'rgba(235,228,200,.95)'; g.lineWidth = 4;
      g.beginPath(); g.moveTo(cx - 15, cy + 6); g.bezierCurveTo(cx - 8, cy - 14, cx, cy + 14, cx + 15, cy - 6); g.stroke();
    }
  });
  const bump = canvasTex(w, h, g => {
    g.fillStyle = '#808080'; g.fillRect(0, 0, w, h);
    speckle(g, w, h, 20000 * area, .12, '0,0,0', '255,255,255', 2);
    for (let i = 0; i < 25 * area + 2; i++) {

// parede com aberturas reais (janelas/portas com cantos arredondados), extrudada na espessura WT
function wallGeom(widthM, holes, y0 = Y0, y1 = Y2, depth = WT) {
  const s = new THREE.Shape();
  s.moveTo(-widthM / 2, y0); s.lineTo(widthM / 2, y0); s.lineTo(widthM / 2, y1); s.lineTo(-widthM / 2, y1); s.closePath();
  for (const [hx, hw, hy0, hy1, r] of holes) {
    const p = new THREE.Path(), x0 = hx - hw / 2, x1 = hx + hw / 2;
    p.moveTo(x0 + r, hy0); p.lineTo(x1 - r, hy0); p.quadraticCurveTo(x1, hy0, x1, hy0 + r);
    p.lineTo(x1, hy1 - r); p.quadraticCurveTo(x1, hy1, x1 - r, hy1); p.lineTo(x0 + r, hy1);
    p.quadraticCurveTo(x0, hy1, x0, hy1 - r); p.lineTo(x0, hy0 + r); p.quadraticCurveTo(x0, hy0, x0 + r, hy0);
    s.holes.push(p);
  }
  const g = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: false, curveSegments: 5 });
  const pos = g.attributes.position, uv = g.attributes.uv;
  for (let i = 0; i < pos.count; i++) uv.setXY(i, pos.getX(i) / widthM + 0.5, (pos.getY(i) - Y0) / (Y2 - Y0));
  return g;
}
// referencial de uma parede: origem na face externa, +z apontando para fora
function wallFrame(cx, cz, nx, nz) {
  const f = new THREE.Group(); f.rotation.y = Math.atan2(nx, nz); f.position.set(cx, 0, cz); train.body.add(f); return f;
}
function buildWall(f, widthM, holes, paint) {
  const m = new THREE.Mesh(wallGeom(widthM, holes), paintMat(paint)); m.position.z = -WT; f.add(m);
  const lin = new THREE.Mesh(wallGeom(widthM, holes, Y0, Y2, 0.004), M.lining); lin.position.z = -WT - 0.004; f.add(lin);   // revestimento interno
}
// caixilho com vidro (no referencial da parede)
function sash(f, x, w, y0, y1, z, mat = M.alu, bar = 0.03, depth = 0.022) {
  const h = y1 - y0, cy = (y0 + y1) / 2;
  bx(f, w, bar, depth, mat, x, y1 - bar / 2, z); bx(f, w, bar, depth, mat, x, y0 + bar / 2, z);
  bx(f, bar, h - 2 * bar, depth, mat, x - w / 2 + bar / 2, cy, z); bx(f, bar, h - 2 * bar, depth, mat, x + w / 2 - bar / 2, cy, z);
  const gl = new THREE.Mesh(new THREE.PlaneGeometry(w - bar * 1.5, h - bar * 1.5), M.glass);
  gl.position.set(x, cy, z); gl.userData.noShadow = true; f.add(gl); return gl;
}
// frisos: cinta inox na linha da cintura, friso acima das janelas e lábio da saia
function moldings(f, widthM, gaps = [], letterboard = true) {
  const segs = []; let a = -widthM / 2;
  for (const [g0, g1] of gaps.slice().sort((p, q) => p[0] - q[0])) { if (g0 > a) segs.push([a, g0]); a = Math.max(a, g1); }
  if (a < widthM / 2) segs.push([a, widthM / 2]);
  for (const [s0, s1] of segs) {
    const len = s1 - s0, cx = (s0 + s1) / 2;
    bx(f, len, 0.032, 0.02, M.trim, cx, Y1, 0.01);
    if (letterboard) bx(f, len, 0.022, 0.014, M.cream, cx, 2.85, 0.007);
    bx(f, len, 0.045, 0.02, M.greenDk, cx, Y0 + 0.022, 0.01);
  }
}

function roofPoint(x, v) {
  const ax = Math.abs(x), hw = W / 2 - Math.max(0, ax - (L / 2 - C));
  const e = Math.min(1, Math.max(0, (ax - (L / 2 - 0.8)) / 0.8));
  const rise = RISE * (1 - 0.72 * e * e), s = 2 * v - 1;
  return [hw * s, Y2 + rise * (1 - s * s)];
}
function roofGeom(x0, x1, v0, v1, lift, nu, nv, caps) {
  const pos = [], uv = [], idx = [];
  for (let i = 0; i <= nu; i++) {
    const x = x0 + (x1 - x0) * i / nu;
    for (let j = 0; j <= nv; j++) { const v = v0 + (v1 - v0) * j / nv, [z, y] = roofPoint(x, v); pos.push(x, y + lift, z); uv.push(x / 3, v * 0.9); }
  }
  for (let i = 0; i < nu; i++) for (let j = 0; j < nv; j++) { const a = i * (nv + 1) + j, b = a + nv + 1; idx.push(a, a + 1, b, b, a + 1, b + 1); }
  if (caps) for (const x of [x0, x1]) {
    const c0 = pos.length / 3; pos.push(x, Y2, 0); uv.push(0, 0);
    for (let j = 0; j <= nv; j++) { const [z, y] = roofPoint(x, v0 + (v1 - v0) * j / nv); pos.push(x, y, z); uv.push(j / nv, 1); }
    for (let j = 0; j < nv; j++) idx.push(c0, c0 + 1 + j, c0 + 2 + j);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals(); return g;
}

function potPlant(x, y, z, { potColor = '#2a4f78', potR = .25, potH = .45, leaves = 12, tex = leafTex, size = .5, spread = .5, glaze = true } = {}) {
  const prof = [[0, 0], [potR * .75, 0], [potR, potH * .55], [potR * .92, potH], [potR * .85, potH], [0, potH * .9]].map(([a, b]) => new THREE.Vector2(a, b));
  const pot = new THREE.Mesh(new THREE.LatheGeometry(prof, 28), new THREE.MeshPhysicalMaterial({ color: potColor, roughness: glaze ? .2 : .8, clearcoat: glaze ? 1 : 0 }));
  pot.position.set(x, y, z); pot.castShadow = pot.receiveShadow = true; scene.add(pot);
  const m = leafMat(tex);
  for (let i = 0; i < leaves; i++) {
    const a = i / leaves * Math.PI * 2 + R() * .4, tilt = .4 + R() * .6, s = size * (.7 + R() * .5);
    const leaf = new THREE.Mesh(new THREE.PlaneGeometry(s * (tex === monsteraTex ? 1 : .5), s), m);
    const pivot = new THREE.Group(); pivot.position.set(x, y + potH * .9, z); pivot.rotation.y = a; scene.add(pivot);
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(.008, .01, spread * (.6 + R() * .5), 5), solid('#3c6a2c'));
    stem.position.y = spread * .3; stem.rotation.x = tilt * .5; pivot.add(stem);
    leaf.position.set(0, spread * .55 + s * .2, Math.sin(tilt) * spread * .5); leaf.rotation.x = -Math.PI / 2 + tilt + .6; leaf.castShadow = true; pivot.add(leaf);
  }
}

function railing(x0, x1, z0, z1, y, h, m = MT.black, step = 0.11) {      // guarda-corpo de barras
  const len = Math.hypot(x1 - x0, z1 - z0), ang = Math.atan2(z1 - z0, x1 - x0);
  const g = new THREE.Group(); g.position.set(x0, y, z0); g.rotation.y = -ang; scene.add(g);
  B(len, .035, .035, m, len / 2, h, 0, g); B(len, .025, .025, m, len / 2, .06, 0, g);
  for (let s = 0; s <= len + 1e-3; s += step) B(.016, h, .016, m, Math.min(s, len), h / 2, 0, g);
  return g;
}

const emissiveMats = new Set();
scene.traverse(o => { if (!o.material) return; for (const m of [].concat(o.material)) if (m.emissive && m.emissiveIntensity > 0 && !(m.emissive.r === 0 && m.emissive.g === 0 && m.emissive.b === 0)) { m.userData.e0 = m.emissiveIntensity; emissiveMats.add(m); } });
const MODES = {
  dia:   { bg: '#ffffff', top: '#5d93cf', hor: '#f3e3c3', gnd: '#6d675c', sun: [-13, 21, 17], sunC: '#fff1dc', sunI: 3.2, hs: '#e2e7ec', hg: '#8f8573', hI: .62, exp: 1.0, env: 1.0, lights: 0, emis: 0, win: 0 },
  tarde: { bg: '#f8efe4', top: '#7088b8', hor: '#ffb27a', gnd: '#5d5048', sun: [-26, 6.5, 11], sunC: '#ffad62', sunI: 2.7, hs: '#f2c7a0', hg: '#5e4c3e', hI: .42, exp: 1.05, env: .6, lights: .35, emis: .45, win: .25 },
  noite: { bg: '#0f1218', top: '#0a1020', hor: '#1c2236', gnd: '#08080a', sun: [12, 20, 15], sunC: '#8aa4dc', sunI: .25, hs: '#33415f', hg: '#0c0c10', hI: .26, exp: 1.35, env: .1, lights: 1, emis: 1, win: 1 },
};
let mode = 'dia';
function setMode(name) {
  const c = MODES[name]; mode = name;
  for (const [id, n] of [['tDia', 'dia'], ['tTarde', 'tarde'], ['tNoite', 'noite']]) document.getElementById(id).setAttribute('aria-pressed', n === name);
  scene.background.set(c.bg); document.body.style.background = c.bg;
  SKY_TOP.set(c.top); SKY_HOR.set(c.hor); GROUND_C.set(c.gnd);
  for (const { m, k } of envPanels) m.material.color.setRGB(1, .97, .92).multiplyScalar(k * c.env);
  envFloor.material.color.set(c.gnd);
  envRT.dispose(); envRT = pmrem.fromScene(envScene, 0.0); scene.environment = envRT.texture;
  sun.position.set(c.sun[0] + XM, c.sun[1], c.sun[2] - 4); sun.target.position.set(XM, 0, -4); sun.color.set(c.sunC); sun.intensity = c.sunI;
  hemi.color.set(c.hs); hemi.groundColor.set(c.hg); hemi.intensity = c.hI;
  renderer.toneMappingExposure = c.exp;
  for (const { light, base, always } of nightLights) {
    if (always) { light.intensity = base * (0.6 + 1.2 * c.lights); continue; }
    light.visible = c.lights > 0; light.intensity = base * c.lights;
  }
  for (const m of emissiveMats) m.emissiveIntensity = m.userData.e0 * (1 + 2.2 * c.emis) + (m === tubeM || m === headM_ref.m || m === ledRef.m ? 2.5 * c.emis : 0);
  for (const m of glowCurtains) { m.emissive.set(c.win > 0 ? '#ffcf8f' : '#000000'); m.emissiveMap = curtainTex; m.emissiveIntensity = .55 * c.win; m.needsUpdate = true; }
}
const headM_ref = { m: null }, ledRef = { m: null };
scene.traverse(o => { if (o.material && o.material.emissive) { const h = '#' + o.material.emissive.getHexString(); if (h === '#ffb860') headM_ref.m = o.material; if (h === '#f4f8ff') ledRef.m = o.material; } });
document.getElementById('tDia').onclick = () => setMode('dia');
document.getElementById('tTarde').onclick = () => setMode('tarde');
document.getElementById('tNoite').onclick = () => setMode('noite');
setMode('dia');
window.__ar = { scene, train, wheelsets, glassBox, contact, XL, XR, XM, CZ, L, WHEEL_R, BBOT };   // usado para exportar o modelo de AR

// ================= tremor do bonde =================
// ruído contínuo (motor, rodas, trilho) + pancadas nas juntas do trilho, com suspensão amortecida
const bogieGroups = train.children.filter(c => c !== train.body);
const JOINT = 6.0, sprF = { y: 0, v: 0 }, sprR = { y: 0, v: 0 }, sprRoll = { y: 0, v: 0 };
let jPrevF = null, jPrevR = null;
function stepSpring(s, dt, K = 900, Cd = 26) { s.v += (-K * s.y - Cd * s.v) * dt; s.y += s.v * dt; }
function tremor(dt, moving) {
  const v = moving ? state.speed : 0, k = Math.min(1.3, v / 7), t = state.t;
  const xF = state.x + 4.15, xR = state.x - 4.15, jf = Math.floor(xF / JOINT), jr = Math.floor(xR / JOINT);
  if (moving && jPrevF !== null && jf !== jPrevF) { sprF.v -= 0.22 * k; sprRoll.v += (R() - .5) * .05 * k; }
  if (moving && jPrevR !== null && jr !== jPrevR) { sprR.v -= 0.2 * k; sprRoll.v += (R() - .5) * .04 * k; }
  jPrevF = jf; jPrevR = jr;
  const sub = 4; for (let i = 0; i < sub; i++) { stepSpring(sprF, dt / sub); stepSpring(sprR, dt / sub); stepSpring(sprRoll, dt / sub, 140, 6); }
  const buzz = () => (R() - .5);
  const jy = k * (0.0022 * Math.sin(t * 9.3) + 0.0012 * Math.sin(t * 23.7 + 1.3) + 0.0007 * Math.sin(t * 47.1 + 2.1) + 0.0006 * buzz());
  const roll = k * (0.0035 * Math.sin(t * 1.6) + 0.0012 * Math.sin(t * 5.9 + .7) + 0.0004 * buzz());
  const pitch = k * (0.0007 * Math.sin(t * 3.1 + .4) + 0.00025 * buzz());
  const yaw = k * (0.0005 * Math.sin(t * 2.3 + .9));
  train.body.position.y = jy + (sprF.y + sprR.y) * 0.5;
  train.body.position.z = k * 0.004 * Math.sin(t * 1.1);
  train.body.rotation.x = roll + sprRoll.y;
  train.body.rotation.z = pitch + (sprF.y - sprR.y) / 8.3;
  train.body.rotation.y = yaw;
  bogieGroups.forEach((b, i) => { const s = i === 0 ? sprF : sprR; b.position.y = s.y * 0.7 + k * 0.0009 * buzz(); b.rotation.x = k * 0.001 * buzz(); });
}

// ================= animação =================
const state = { x: START, playing: true, loop: true, speed: 25 / 3.6, wait: 0, follow: false, t: 0 };
const bPlay = document.getElementById('bPlay'), bLoop = document.getElementById('bLoop'), cFollow = document.getElementById('cFollow');
const spd = document.getElementById('spd'), spdOut = document.getElementById('spdOut');
bPlay.onclick = () => { state.playing = !state.playing; bPlay.textContent = state.playing ? 'Pausar' : 'Reproduzir'; };
document.getElementById('bRestart').onclick = () => { state.x = START; state.wait = 0; state.playing = true; bPlay.textContent = 'Pausar'; };
bLoop.onclick = () => { state.loop = !state.loop; bLoop.setAttribute('aria-pressed', state.loop); };
spd.oninput = () => { state.speed = spd.value / 3.6; spdOut.textContent = spd.value + ' km/h'; };

let camAnim = null;
function goTo(pos, tgt) {
  state.follow = false; cFollow.setAttribute('aria-pressed', 'false');
  camAnim = { t: 0, p0: camera.position.clone(), p1: new THREE.Vector3(...pos), q0: controls.target.clone(), q1: new THREE.Vector3(...tgt) };
}
document.getElementById('cSide').onclick = () => goTo([XM, 3.6, 46], [XM, 3.0, -3]);
document.getElementById('c34').onclick = () => goTo([XM + 22, 16, 36], [XM - 1, 2.2, -4]);
document.getElementById('cLow').onclick = () => goTo([-3, 0.55, 5.5], [5, 1.6, -2]);
cFollow.onclick = () => {
  state.follow = !state.follow; cFollow.setAttribute('aria-pressed', state.follow);
  if (state.follow) { camAnim = null; const dx = state.x - controls.target.x; controls.target.x += dx; camera.position.x += dx; }
};
camera.position.set(XM + 22, 16, 36); controls.target.set(XM - 1, 2.2, -4);

window.__tram = { mode: n => setMode(n), set(x) { state.x = x; }, pause() { state.playing = false; }, cam(p, t) { camAnim = null; camera.position.set(...p); controls.target.set(...t); } };

function resize() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.fov = w < h ? 62 : 40; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05); state.t += dt;
  for (const fn of tickers) fn(dt);
  const prev = state.x;
  if (state.playing) {
    if (state.x < END) state.x = Math.min(END, state.x + state.speed * dt);
    else if (state.loop) { state.wait += dt; if (state.wait > 1.4) { state.x = START; state.wait = 0; } }
  }
  const moved = state.x - prev, moving = state.playing && state.x < END ? 1 : 0;
  train.position.x = state.x;
  for (const ws of wheelsets) ws.rotation.z = -state.x / WHEEL_R;
  tremor(dt, moving === 1);
  if (state.follow && moved !== 0 && Math.abs(moved) < 5) { controls.target.x += moved; camera.position.x += moved; }
  if (camAnim) {
    camAnim.t = Math.min(1, camAnim.t + (reduce ? 1 : 0.03)); const e = 1 - Math.pow(1 - camAnim.t, 3);
    camera.position.lerpVectors(camAnim.p0, camAnim.p1, e); controls.target.lerpVectors(camAnim.q0, camAnim.q1, e);
    if (camAnim.t >= 1) camAnim = null;
  }
  controls.update(); renderer.render(scene, camera);
});

// placa em japonês quando a fonte carregar
if (document.fonts && document.fonts.load) {
  document.fonts.load('700 74px "Zen Kaku Gothic New"', '藤沢鎌倉').then(f => {
    if (f && f.length) { const c = destTex.image; drawDest(c.getContext('2d'), c.width, c.height, true); destTex.needsUpdate = true; }
  }).catch(() => {});
}
</script>
